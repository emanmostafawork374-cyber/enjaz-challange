<title>تحدي إنجاز</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width column (max 560px). Header with progress ring, four views swapped inside #app, fixed bottom tab bar. */
:root{
  --bg:#fbf3e8; --card:#fffdf8; --ink:#26331f; --muted:#667359; --line:#d9e6c0;
  --green:#78b72a; --green-d:#4f8a1c; --deep:#2f5a14; --on-deep:#ffffff;
  --pink:#b0356b; --pink-bg:#fdeaf2; --gold:#f2b705; --tint:#eaf4d6;
  --btn-bg:#4f8a1c; --btn-fg:#ffffff; --field:#ffffff;
  --font:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141c11; --card:#1d2819; --ink:#eef4e6; --muted:#a3b296; --line:#31432a;
  --green:#8cc83e; --green-d:#8cc83e; --deep:#244316; --on-deep:#ffffff;
  --pink:#ff93c0; --pink-bg:#3a1c2b; --gold:#f2b705; --tint:#25351c;
  --btn-bg:#8cc83e; --btn-fg:#12200a; --field:#141c11; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141c11; --card:#1d2819; --ink:#eef4e6; --muted:#a3b296; --line:#31432a;
  --green:#8cc83e; --green-d:#8cc83e; --deep:#244316; --on-deep:#ffffff;
  --pink:#ff93c0; --pink-bg:#3a1c2b; --gold:#f2b705; --tint:#25351c;
  --btn-bg:#8cc83e; --btn-fg:#12200a; --field:#141c11; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;direction:rtl;
  padding-block:0 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:560px;margin-inline:auto}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.3}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--green-d)}
.top h1{font-size:24px;font-weight:800;color:var(--deep)}
:root[data-theme="dark"] .top h1{color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top h1{color:var(--green)}}
.ring{flex:none;width:54px;height:54px;position:relative}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:18px;font-weight:800;color:var(--deep);margin-bottom:4px}
:root[data-theme="dark"] .card h2{color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card h2{color:var(--green)}}
.sub{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl>span{font-weight:700;font-size:14px}
input[type=text],input[type=date],input[type=number],textarea{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
textarea{resize:vertical;min-height:76px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
/* pills (checkbox / radio) */
.pill{display:inline-flex;position:relative}
.pill input{position:absolute;opacity:0;width:1px;height:1px}
.pill span{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--green-d);background:var(--card);cursor:pointer;font-weight:600;user-select:none}
.pill span::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid currentColor;flex:none}
.pill input:checked+span{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.pill input:checked+span::before{content:"\2713";display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1;border-color:currentColor}
.pill input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
/* thawabet */
.thaw{background:var(--deep);color:var(--on-deep);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.thaw .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:800;font-size:17px}
.thaw .hd em{font-style:normal;background:var(--gold);color:#26331f;border-radius:999px;padding:0 10px;font-size:12px;font-weight:800}
.thaw .lbl{font-size:13px;font-weight:700;opacity:.9;margin:8px 0 6px}
.thaw .pill span{background:transparent;color:var(--on-deep);border-color:rgba(255,255,255,.55)}
.thaw .pill input:checked+span{background:var(--gold);color:#26331f;border-color:var(--gold)}
.prs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.prs .pill{display:flex}
.prs .pill span{flex-direction:column;justify-content:center;gap:4px;padding:8px 2px;border-radius:14px;font-size:13px;width:100%;text-align:center}
.prs .pill span::before{width:22px;height:22px}
/* shared challenge */
.sh{display:flex;gap:12px;align-items:center;background:var(--pink-bg);border:1.5px solid var(--pink);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.sh img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--pink);background:var(--card);flex:none}
.tagp{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:0 10px;font-size:12px;font-weight:800}
:root[data-theme="dark"] .tagp{color:#2a0f1c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tagp{color:#2a0f1c}}
.sh p{font-weight:700;margin-top:2px;line-height:1.5}
.sh .pill span{border-color:var(--pink);color:var(--pink)}
.sh .pill input:checked+span{background:var(--pink);color:#fff;border-color:var(--pink)}
:root[data-theme="dark"] .sh .pill input:checked+span{color:#2a0f1c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sh .pill input:checked+span{color:#2a0f1c}}
.sh .mid{flex:1;min-width:0}
.sh .go{flex:none}
@media (max-width:420px){.sh{flex-wrap:wrap}.sh .go{width:100%}.sh .go .pill{display:flex}.sh .go span{width:100%;justify-content:center}}
/* day header */
.dh{display:flex;align-items:center;gap:12px}
.dn{flex:none;width:56px;height:56px;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.chip{display:inline-block;background:var(--tint);border-radius:999px;padding:0 10px;font-size:12px;font-weight:700;color:var(--deep)}
:root[data-theme="dark"] .chip{color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip{color:var(--green)}}
.mis{margin-top:10px;background:var(--tint);border-radius:12px;padding:10px 12px;font-weight:600}
.daychips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin}
.dc{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;text-decoration:none;border:2px solid var(--green-d);background:var(--card)}
.dc.st-yes{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.dc.st-part{background:var(--gold);color:#26331f;border-color:var(--gold)}
.dc.st-no{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.dc.cur{box-shadow:0 0 0 3px var(--gold)}
.navrow{display:flex;gap:10px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border-radius:14px;border:2px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);font-weight:800;cursor:pointer;text-decoration:none;flex:1}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
/* board */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--tint);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--deep);font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .stat b{color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat b{color:var(--green)}}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;margin-top:12px}
.gc{text-align:center;text-decoration:none}
.gc .c{width:100%;max-width:64px;aspect-ratio:1;margin-inline:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;border:3px solid var(--green-d);background:var(--card)}
.gc small{display:block;font-size:11px;color:var(--muted);min-height:16px}
.gc.st-yes .c{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.gc.st-part .c{background:var(--gold);color:#26331f;border-color:var(--gold)}
.gc.st-no .c{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.note{background:var(--card);border-inline-start:4px solid var(--green-d);border-radius:10px;padding:10px 12px;font-size:14px}
/* steps / chips */
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sug button{background:transparent;border:1.5px dashed var(--green-d);border-radius:12px;padding:6px 12px;min-height:40px;cursor:pointer;text-align:start;font-size:14px}
.ideas{background:var(--tint);border-radius:12px;padding:4px 12px 12px}.ideas summary{color:var(--deep)}
:root[data-theme="dark"] .ideas summary{color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ideas summary{color:var(--green)}}
.lvl{font-weight:800;font-size:14px;margin-top:12px}
.lvl small{color:var(--muted);font-weight:600}
.hero{display:flex;gap:14px;align-items:flex-end;overflow:hidden}
.hero img{width:120px;flex:none;align-self:flex-end;margin-bottom:-16px}
.hero .t{padding-bottom:4px;min-width:0}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
ol.s{margin:6px 0 0;padding-inline-start:20px}
.pledge{background:var(--deep);color:var(--on-deep);border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:600}
.pledge b{color:var(--gold)}
/* finish */
.cap{background:var(--tint);border-radius:12px;padding:12px;white-space:pre-wrap;line-height:1.9}
.banner{background:var(--pink);color:#fff;text-align:center;font-weight:800;font-size:18px;border-radius:14px;padding:14px;margin-bottom:12px}
:root[data-theme="dark"] .banner{color:#2a0f1c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner{color:#2a0f1c}}
.certbox img{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:12px}
.msg{font-size:14px;color:var(--pink);font-weight:700;margin-top:8px}
/* tab bar */
.tabbar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tabs{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:12px;text-decoration:none;font-size:12px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--tint);color:var(--deep)}
:root[data-theme="dark"] .tab.on{color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab.on{color:var(--green)}}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.card,.thaw,.sh{animation:up .25s ease both}@keyframes up{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<div class="col">
  <header class="top">
    <div><div class="brand">إنجاز <span>|</span> <span dir="ltr">Design &amp; Plan</span></div><h1>تحدي إنجاز ١٤ يوم</h1></div>
    <div class="ring" id="ring" aria-label="عدد الأيام المنجزة"></div>
  </header>
  <main id="app"></main>
  <div class="foot">بياناتك بتتحفظ على جهازك أنتِ بس.</div>
</div>

</div></nav>

  +'<section class="card"><h2>خطة الطوارئ: لو حصل… هعمل…</h2><div class="stack">'+fld('plan.0.if','لو','مثال: لو تعبت')+fld('plan.0.then','هعمل','مثال: هعمل الخطوة الصغيرة بس')+fld('plan.1.if','ولو','')+fld('plan.1.then','هعمل','')+'</div></section>'
  +'<section class="card"><h2>شريكتي في المتابعة</h2><div class="stack">'+fld('partner','اسمها','')+fld('partnerFreq','هبعتلها تحديث كل','مثال: كل يومين')+'<div class="pills">'+chk('announced','نشرت في الستوري إني بدأت التحدي')+'</div></div></section>'
  +'<section class="card"><h2>عهدي مع نفسي</h2><p>أتعهد إني أكمل ١٤ يوم من تحدي إنجاز، <b>وما أتنازلش عن الصلوات المفروضة والأذكار</b>، وأفتح التراكر كل يوم ولو ٥ دقايق، ولو فاتني يوم هرجع بكرة من غير ما ألوم نفسي.</p><div class="stack"><div class="pills">'+chk('pledge','أتعهد بده')+'</div>'+fld('reward','مكافأتي لنفسي لما أخلص','')+'<a class="btn" href="#day-1">ابدئي اليوم الأول</a></div></section>'}

function vBoard(){
  var g='';for(var d=1;d<=14;d++){var lab={7:'نص الطريق',8:'مراجعة',14:'العرض'}[d]||'';
    g+='<a class="gc st-'+(resOf(d)||'none')+'" id="gc-'+d+'" href="#day-'+d+'"><div class="c">'+ar(d)+'</div><small>'+lab+'</small></a>'}
  return '<section class="card"><h2>لوحة التزامي</h2><p class="sub">كل يوم تسجّلي نتيجته بيتلوّن هنا. اضغطي على أي يوم تفتحيه.</p>'
  +'<div class="stats" style="margin-top:12px"><div class="stat"><b id="st-days"></b><span>أيام الإنجاز</span></div><div class="stat"><b id="st-pr"></b><span>صلوات</span></div><div class="stat"><b id="st-ad"></b><span>أذكار</span></div></div>'
  +'<div class="grid">'+g+'</div></section>'
  +'<div class="note"><b>تذكري:</b> الصلوات والأذكار هي الأساس، والإنجاز بيتبني فوقها. ولا تفوّتي مرتين: دايرة ملوّنة بعد يوم صعب بتساوي ضعف.</div>'
  +'<section class="card" style="margin-top:12px"><div class="stats"><div class="stat" style="grid-column:1/-1"><b id="st-th"></b><span>التزامي بالثوابت (الصلوات والأذكار)</span></div></div></section>'}

function curDay(){var sd=get('startDate');if(sd){var n=Math.floor((Date.now()-new Date(sd+'T00:00:00').getTime())/864e5)+1;if(n>=1&&n<=14)return n}
  for(var d=1;d<=14;d++)if(!resOf(d))return d;return 14}

function vDay(d){
  var k=function(p){return 'days.'+d+'.'+p},sn=STEPOF[d],st=sn?(get('steps.'+(sn-1))||''):'';
  var chips='';for(var i=1;i<=14;i++)chips+='<a class="dc st-'+(resOf(i)||'none')+(i===d?' cur':'')+'" id="dc-'+i+'" href="#day-'+i+'" aria-label="اليوم '+ar(i)+'">'+ar(i)+'</a>';
  var pr=PRAY.map(function(p,i){return chk(k('pr.'+i),p)}).join('');
  var task=sn?'خطوة '+ar(sn)+' من إنجازي'+(st?': <b>'+esc(st)+'</b>':' <span class="sub">(اكتبي خطواتك في صفحة «ابدأي»)</span>'):'مهمة الإنجاز';
  var rev='';
  if(d===8)rev='<section class="card"><h2>مراجعة منتصف التحدي</h2><div class="stack">'
   +fld('review.pray','التزمت بالصلوات والأذكار كام يوم من ٧؟','','input','number')+fld('review.ach','التزمت بإنجازي كام يوم من ٧؟','','input','number')
   +fld('review.good','إيه اللي ماشي كويس؟','')+fld('review.fix','إيه اللي محتاج تعديل؟','')
   +'<div><div class="sub" style="margin-bottom:6px">هل إنجازي لسه مناسب؟</div><div class="pills">'+rad('review.fit','ok','مناسب')+rad('review.fit','small','أصغّره شوية')+rad('review.fit','steps','أعدّل خطواتي')+'</div><p class="sub" style="margin-top:6px">تصغير الإنجاز مش فشل، ده ذكاء. المهم تخلصي وتكملي.</p></div>'
   +fld('review.week2','التزامي للأسبوع التاني','')+'</div></section>';
  var nav='<div class="navrow"><a class="btn ghost" '+(d>1?'href="#day-'+(d-1)+'"':'aria-disabled="true" style="opacity:.4;pointer-events:none"')+'>اليوم السابق</a><a class="btn" href="'+(d<14?'#day-'+(d+1):'#finish')+'">'+(d<14?'اليوم التالي':'للختام')+'</a></div>';
  return '<nav class="daychips" aria-label="الأيام">'+chips+'</nav>'
  +'<section class="card"><div class="dh"><div class="dn">'+ar(d)+'</div><div><h2 style="margin:0">اليوم '+ar(d)+'</h2><span class="chip">'+PHASE[d]+'</span></div></div><div class="mis"><b>مهمة اليوم:</b> '+MISSION[d]+'</div></section>'
  +'<section class="thaw"><div class="hd">ثوابتي <em>مفيش تنازل</em></div><div class="lbl">الصلوات المفروضة</div><div class="prs">'+pr+'</div><div class="lbl">الأذكار</div><div class="pills">'+chk(k('ad.0'),'الصباح')+chk(k('ad.1'),'المساء')+'</div></section>'
  +'<section class="sh"><img src="'+AVATAR+'" alt=""><div class="mid"><span class="tagp">تحدي اليوم المشترك · ريفرش</span><p>'+SHARED[d]+'</p></div><div class="go">'+chk(k('ch'),'خلّصته')+'</div></section>'
  +'<section class="card"><h2>الصبح · النية</h2><div class="stack">'+fld(k('intent'),'النهارده هعمل','')+'<div class="row">'+fld(k('time'),'في وقت','')+fld(k('place'),'في مكان','')+'</div></div></section>'
  +'<section class="card"><h2>أثناء اليوم · التنفيذ</h2><div class="stack"><div class="pills">'+chk(k('doTask'),task)+chk(k('doHabit'),'عادتي الصغيرة'+(get('habit')?': '+esc(get('habit')):' (دقيقتين)'))+'</div>'+fld(k('did'),'عملت إيه بالظبط؟','','textarea')+'</div></section>'
  +'<section class="card"><h2>قبل النوم · التسجيل</h2><div class="stack"><div><div class="sub" style="margin-bottom:6px">أنجزت النهارده؟</div><div class="pills">'+rad(k('res'),'yes','نعم ✓')+rad(k('res'),'part','جزئياً')+rad(k('res'),'no','لا ✗')+'</div></div>'+fld(k('help'),'إيه اللي ساعدني أو عطّلني؟','')+fld(k('proud'),'حاجة أفتخر بيها النهارده','')+'</div></section>'
  +rev+nav}

function vFinish(){
  var s=stats();
  return '<section class="card"><h2>رحلتي في أرقام</h2><div class="stats" style="margin-top:8px"><div class="stat"><b id="st-days"></b><span>أيام الإنجاز</span></div><div class="stat"><b id="st-pr"></b><span>صلوات</span></div><div class="stat"><b id="st-ad"></b><span>أذكار</span></div></div></section>'
  +'<section class="card"><h2>عرض إنجازي</h2><p class="sub">جهّزي دليل الإنجاز (صورة قبل وبعد، ملف، أو تسجيل) وانشريه بالكابشن ده.</p><div class="stack">'+fld('share.hard','أصعب لحظة كانت','')+fld('share.help','واللي ساعدني','')
  +'<div class="cap" id="cap"></div><button type="button" class="btn" data-act="copy">انسخي الكابشن</button><div class="pills">'+chk('share.c0','دليل الإنجاز جاهز')+chk('share.c1','عملت منشن لحساب إنجاز')+chk('share.c2','نشرت في الستوري أو الريلز')+'</div></div></section>'
  +'<section class="card"><h2>تقرير النهاية</h2><div class="stack">'+fld('report.changed','إيه اللي اتغيّر فيّا؟','','textarea')+fld('report.learned','إيه اللي اتعلمته عن نفسي؟','','textarea')+fld('report.next','هدفي الجاي','')
  +'<div><div class="sub" style="margin-bottom:6px">إنجازي</div><div class="pills">'+rad('report.ach','full','كامل')+rad('report.ach','partial','جزئي')+'</div></div>'+fld('report.pct','نسبة اللي أنجزته (لو جزئي)','مثال: ٧٠','input','number')+'</div></section>'
  +'<div class="banner">أنا شخص بيلتزم بوعده لنفسه.</div>'
  +'<section class="card certbox"><h2>شهادتي</h2><p class="sub">الشهادة بتتجهّز بعد ما تخلّصي الـ١٤ يوم. اكتبي بياناتك واضغطي «جهّزي الشهادة»، وبعدها اضغطي على الصورة مطولاً واحفظيها.</p><div class="stack">'+fld('name','الاسم على الشهادة','')+fld('cert.ach','الإنجاز المكتوب على الشهادة (لو سبتيه فاضي هيتاخد من إنجازك)','')+'<div class="row">'+fld('cert.date','التاريخ','مثال: ٢٠ نوفمبر ٢٠٢٦')+fld('cert.batch','الدفعة','مثال: الأولى')+'</div>'
  +'<button type="button" class="btn" data-act="cert">جهّزي الشهادة</button><div id="certout"></div></div></section>'
  +'<section class="card"><h2>مسح بياناتي</h2><p class="sub">ده بيمسح كل اللي كتبتيه من الجهاز ده.</p><div id="resetbox" style="margin-top:8px"><button type="button" class="btn ghost" data-act="reset1">مسح كل البيانات</button></div></section>'}

/* ---------- routing ---------- */
function route(){
  var h=(location.hash||'').replace('#',''),v,d;
  if(!h){h=get('ach')?'day-'+curDay():'start'}
  var m=/^day-(\d+)$/.exec(h);
  if(m){d=Math.min(14,Math.max(1,+m[1]));v='day'}else if(h==='day'){d=curDay();v='day'}else if(h==='board'||h==='finish'||h==='start'){v=h}else{v='start'}
  app.innerHTML=v==='start'?vStart():v==='board'?vBoard():v==='finish'?vFinish():vDay(d);
  Array.prototype.forEach.call(document.querySelectorAll('#tabs .tab'),function(a){a.classList.toggle('on',a.dataset.t===v)});
  hydrate();paintLive();window.scrollTo(0,0);
  var c=$('dc-'+d);if(c&&c.scrollIntoView){try{c.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
}
function hydrate(){Array.prototype.forEach.call(app.querySelectorAll('[data-k]'),function(el){var v=get(el.dataset.k);
  if(el.type==='checkbox')el.checked=!!v;else if(el.type==='radio')el.checked=(v===el.value);else el.value=(v==null?'':v)})}
app.addEventListener('input',function(e){var el=e.target;if(!el.dataset||!el.dataset.k||el.type==='checkbox'||el.type==='radio')return;set(el.dataset.k,el.value);paintLive()});
app.addEventListener('change',function(e){var el=e.target;if(!el.dataset||!el.dataset.k)return;
  if(el.type==='checkbox')set(el.dataset.k,el.checked);else if(el.type==='radio'){if(el.checked)set(el.dataset.k,el.value)}else set(el.dataset.k,el.value);paintLive()});
app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='fill'){set('ach',b.dataset.v);var t=$('f-ach');if(t){t.value=b.dataset.v;t.focus();try{t.scrollIntoView({block:'center'})}catch(err){}}paintLive()}
  else if(a==='copy'){var txt=caption();var ok=function(){b.textContent='اتنسخ ✓'};
    try{navigator.clipboard.writeText(txt).then(ok,function(){selectCap()})}catch(err){selectCap()}}
  else if(a==='cert'){makeCert()}
  else if(a==='reset1'){$('resetbox').innerHTML='<p class="msg">متأكدة؟ مش هتقدري ترجّعي البيانات.</p><div class="navrow"><button type="button" class="btn" data-act="reset2">نعم، امسحي</button><button type="button" class="btn ghost" data-act="reset0">لأ</button></div>'}
  else if(a==='reset0'){$('resetbox').innerHTML='<button type="button" class="btn ghost" data-act="reset1">مسح كل البيانات</button>'}
  else if(a==='reset2'){S={};try{localStorage.removeItem(KEY)}catch(err){}location.hash='#start';route()}});
function selectCap(){var c=$('cap');if(c&&window.getSelection){var r=document.createRange();r.selectNodeContents(c);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}}
window.addEventListener('hashchange',route);

/* ---------- certificate (canvas) ---------- */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function star(x,cx,cy,R,col){x.fillStyle=col;x.beginPath();for(var i=0;i<10;i++){var r=i%2?R*.45:R,an=-Math.PI/2+i*Math.PI/5;x.lineTo(cx+r*Math.cos(an),cy+r*Math.sin(an))}x.closePath();x.fill()}
function fit(x,txt,w,size,weight){var s=size;do{x.font=weight+' '+s+'px Cairo, Tahoma, sans-serif';s-=2}while(x.measureText(txt).width>w&&s>26);return txt}
function wrap(x,txt,w){var ws=txt.split(' '),lines=[],cur='';ws.forEach(function(wd){var t=cur?cur+' '+wd:wd;if(x.measureText(t).width>w&&cur){lines.push(cur);cur=wd}else cur=t});if(cur)lines.push(cur);return lines}
function img(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src})}
function makeCert(){
  var out=$('certout'),name=(get('name')||'').trim();
  if(!name){out.innerHTML='<p class="msg">اكتبي اسمك الأول علشان يتكتب على الشهادة.</p>';return}
  out.innerHTML='<p class="sub" style="margin-top:8px">بجهّز شهادتك…</p>';
  var full=get('report.ach')!=='partial',ac=full?'#78b72a':'#c8467f',ach=(get('cert.ach')||get('ach')||'').trim(),pct=get('report.pct');
  var p=[];try{p=[document.fonts.load('800 80px Cairo'),document.fonts.load('600 40px Cairo'),document.fonts.load('700 40px Cairo')]}catch(e){}
  Promise.all(p.map(function(q){return q.catch(function(){})})).then(function(){return img(CHAR)}).then(function(ci){
    var W=1754,H=1240,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
    x.fillStyle='#fbf3e8';x.fillRect(0,0,W,H);
    x.lineWidth=14;x.strokeStyle=ac;rr(x,36,36,W-72,H-72,40);x.stroke();
    x.setLineDash([3,10]);x.lineWidth=3;x.strokeStyle='#c8467f';rr(x,64,64,W-128,H-128,28);x.stroke();x.setLineDash([]);
    star(x,110,110,34,'#f2b705');star(x,W-110,110,34,'#f2b705');
    x.fillStyle='#e6f2cf';x.beginPath();x.arc(330,650,260,0,Math.PI*2);x.fill();
    if(ci){var ch=780,cw=ch*ci.width/ci.height;x.drawImage(ci,330-cw/2,1100-ch,cw,ch)}
    x.fillStyle=ac;rr(x,76,H-170,W-152,92,22);x.fill();
    x.direction='rtl';x.textAlign='center';x.textBaseline='alphabetic';
    var cx=1130;
    x.fillStyle='#4f8a1c';x.font='700 34px Cairo, Tahoma, sans-serif';x.fillText('إنجاز  |  Design & Plan',cx,140);
    x.fillStyle='#2f5a14';x.font='800 130px Cairo, Tahoma, sans-serif';x.fillText(full?'شهادة تقدير':'شهادة إنجاز جزئي',cx,280);
    x.fillStyle=ac;rr(x,cx-270,312,540,66,33);x.fill();x.fillStyle='#fff';x.font='700 38px Cairo, Tahoma, sans-serif';x.fillText('تحدي إنجاز ١٤ يوم',cx,358);
    x.fillStyle='#4a5a3f';x.font='600 42px Cairo, Tahoma, sans-serif';x.fillText('تُمنح هذه الشهادة إلى',cx,450);
    x.fillStyle='#26331f';fit(x,name,880,100,800);x.fillText(name,cx,572);
    x.setLineDash([3,10]);x.lineWidth=3;x.strokeStyle='#8fa07c';x.beginPath();x.moveTo(690,596);x.lineTo(1570,596);x.stroke();x.setLineDash([]);
    x.fillStyle='#26331f';x.font='600 40px Cairo, Tahoma, sans-serif';
    var body=full?'تقديراً لوفائها بوعدها لنفسها، وإتمامها ١٤ يوماً من الالتزام مع المحافظة على ثوابت التحدي (الصلوات المفروضة والأذكار)، وتحقيقها هذا الإنجاز:':'تقديراً لسعيها وثباتها في تحدي إنجاز ١٤ يوم، فالعبرة بالاستمرار وليست بالكمال. وقد حققت من هدفها:';
    wrap(x,body,960).forEach(function(l,i){x.fillText(l,cx,680+i*66)});
    var al=(ach?ach:'………')+(!full&&pct?' (بنسبة '+ar(pct)+'٪)':'');
    x.fillStyle='#26331f';fit(x,'أنجزت: '+al,960,48,700);x.fillText('أنجزت: '+al,cx,900);
    x.fillStyle=ac;x.font='800 54px Cairo, Tahoma, sans-serif';x.fillText(full?'أنا شخص بيلتزم بوعده لنفسه.':'كل خطوة كملتيها هي إنجاز حقيقي.',cx,985);
    x.fillStyle='#26331f';x.font='700 36px Cairo, Tahoma, sans-serif';
    var dt=get('cert.date')||'',bt=get('cert.batch')||'';
    x.fillText('التاريخ: '+(dt||'……………'),cx+260,1050);x.fillText('الدفعة: '+(bt||'……………'),cx-260,1050);
    x.direction='ltr';x.fillStyle='#2f5a14';x.font='800 34px Cairo, Tahoma, sans-serif';x.fillText('Design & Plan | Emanmostafa',cx,1100);x.direction='rtl';
    x.fillStyle='#fff';x.font='700 34px Cairo, Tahoma, sans-serif';x.fillText('الصلاة والأذكار ثابتان… والباقي يتبني فوقهم',W/2,H-112);
    var url=c.toDataURL('image/png');
    out.innerHTML='<img src="'+url+'" alt="شهادة '+esc(name)+'"><p class="sub" style="margin-top:8px">اضغطي على الصورة مطولاً (أو كليك يمين) واحفظيها، وشاركيها مع حساب إنجاز.</p>';
  }).catch(function(){out.innerHTML='<p class="msg">حصلت مشكلة في تجهيز الشهادة، جرّبي تاني.</p>'});
}
route();
})();
</script>
